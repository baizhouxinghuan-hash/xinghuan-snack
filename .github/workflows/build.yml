name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile all sources
        run: |
          mkdir -p target/classes
          find src -name "*.java" > sources.txt
          javac -encoding UTF-8 -d target/classes -cp "lib/*" @sources.txt

      - name: Run smoke test
        run: |
          java -Dfile.encoding=UTF-8 -cp "target/classes:lib/*" xiaobaisnack.crawler.app.SmokeTest
